<!DOCTYPE html>
<html lang = "en">
    <head> 
        <meta charset = "utf-8">
        <meta name = "viewport" contnet = "width=device-width, initial-scale = 1">
        <title> MinWarranty | Dashboard </title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/dashboard.js"></script>
    </head>
    <body>
        <header id ="header"> 
            Dashboard
            <nav id ="left-nav" aria-label="Main">
                <ul id = "nav-links-user">
                    <li><a href ="index.html"> Home</a></li>
                    <li><a href ="dashboard.html" aria-current="page"> Dashboard</a></li>
                </ul>
            </nav>
            <nav id="right-nav" aria-label="Account">
                <ul id="nav-links-account">
                    <li>
                        <form action="/logout" method="post">
                            <button type="submit">Log Out</button>
                        </form>
                    </li>
                </ul>
            </nav>
        </header>
        <section id="warranties" aria-labelledby="warranties-heading">
            <div class="section-header">
                <h1 id="warranties-heading">My Warranties</h1>
                <button type="button" id="addWarranty">+ Add Warranty</button>
            </div>
            <div class="warranty-toolbar">
                <div class="form-group">
                    <label for="searchWarranties">Search</label>
                    <input type="search" id="searchWaranties" placeholder="Product or retailer" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="all" selected>All</option>
                        <option value="active">Active</option>
                        <option value="expiring">Expiring soon</option>
                        <option value="expired">Expired</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="sortWarranties">Sort by</label>
                    <select id="sortWarranties">
                        <option value="expiry-asc" selected>Expiry date (ascending)</option>
                        <optiion value="expiry-desc">Expiry date (descending)</optiion>
                        <option value="purchase-desc">Purchase date</option>
                        <option value="name-asc">Product Name (A to Z)</option>
                    </select>
                </div>
            </div>
            <p id="warrantyCount" class="warranty-count" aria-live="polite"></p>
            <ul id="warrantyList" class="warranty-list" role="list">
                <!-- Sample card for styling. JavaScript will render the real cards-->>
                <li class="waranty-card" data-id="sample">
                    <div class="warranty-card-header">
                        <h2>Sony WH1000XM5 Headphones</h2>
                        <span class="status-badge status-active">Active</span>
                    </div>
                    <dl class="warranty-details">
                        <div>
                            <dt>Purchased</dt>
                            <dd><time datetime="2025-03-14">March 14, 2025</time></dd>
                        </div>
                        <div>
                            <dt>Expires</dt>
                            <dd><time datetime="2027-03-14">March 14, 2027</time></dd>
                        </div>
                        <div>
                            <dt>Remaining</dt>
                            <dd>478 days</dd>
                        </div>
                        <div>
                            <dt>Retailer</dt>
                            <dd>Best Buy</dd>
                        </div>
                        <div>
                            <dt>Serial Number</dt>
                            <dd>SN-8841-2207</dd>
                        </div>
                    </dl>
                    <p class="warranty-notes">Receipt is in the blue folder.</p>
                    <div class="warranty-cations">
                        <button type="button" class="edit-warranty" aria-label="Edit Sony WH1000XM5 Headphones">Edit</button>
                        <button type="button" class="delete-warranty" aria-label="Delete Sony WH1000XM5 Headphones">Delete</button>
                    </div>
                </li>
            </ul>
    </body>
</html>
