<!--
    MinWarranty - Registration Page

    Shows the form for creating an account.
    Loads auth.js to handle form submission.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page fit the width of a phone screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinWarranty | Register</title>

    <!-- Loads the styles for this page. -->
    <link rel="stylesheet" href="css/style.css">
    <!-- defer waits for the HTML to load before running auth.js. -->
    <script src="js/auth.js" defer></script>
</head>

<body class="auth-page">

    <!-- Header with links to Home, Login, and Register. -->
    <header id="header" class="auth-header">
        <a href="index.html" class="brand">
            MinWarranty
        </a>
        <nav aria-label="Main navigation">
            <ul class="auth-nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li>
                    <!-- Marks Register as the current page. -->
                    <a href="register.html" aria-current="page"> Register</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="auth-main">

        <!--  the headings -->
        <section class="auth-card"
                 aria-labelledby="register-title">

            <div class="auth-card-top">
                <div class="auth-logo">MW</div>

                <h1 id="register-title">
                    Create Your Account
                </h1>

                <p>
                    Keep your warranties organized
                    in one secure place.
                </p>
            </div>

            <!-- auth.js finds the form by its ID.
                 data-mode tells the script this is the register form. -->
            <form id="auth-form"
                  data-mode="register"
                  class="auth-form">

                <div class="form-group">
                    <!-- for="email" connects this label to the email input. -->
                    <label for="email">Email Address</label>

                    <!-- The browser checks the email is filled in
                         and looks like an email address. -->
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="254"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <!-- Hides what the user types and sets an 8 to 72
                         character limit. aria-describedby links the hint below. -->
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        aria-describedby="password-help"
                        required>

                    <small id="password-help">
                        Use at least 8 characters.(max 72)
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <!-- The user retypes their password here.
                         JavaScript can compare the two values. -->
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required>
                </div>

                <!-- The script puts feedback here. A screen reader
                     can read the message when it changes. -->
                <p id="message"
                   role="status"
                   aria-live="polite"></p>

                <!-- The browser checks the fields before submitting. -->
                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in here</a>
            </p>

        </section>
    </main>

    <footer class="auth-footer">
        <p>&copy; 2026 MinWarranty. All rights reserved.</p>
    </footer>


</body>
</html>
