<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MinWarranty | Register</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js" defer></script>
</head>

<body class="auth-page">

    <!-- Website Header -->
    <header id="header" class="auth-header">
        <a href="index.html" class="brand">
            MinWarranty
        </a>
        <nav aria-label="Main navigation">
            <ul class="auth-nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li>
                    <a href="register.html" aria-current="page"> Register</a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Registration Section -->
    <main class="auth-main">

        <section class="auth-card"
                 aria-labelledby="register-title">

            <div class="auth-card-top">
                <div class="auth-logo">MW</div>

                <h1 id="register-title">
                    Create Your Account
                </h1>

                <p>
                    Keep your warranties organized
                    in one secure place.
                </p>
            </div>

            <!-- Registration Form -->
            <form id="auth-form"
                  data-mode="register"
                  class="auth-form">

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        maxlength="254"
                        required>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        aria-describedby="password-help"
                        required>

                    <small id="password-help">
                        Use 8 to 72 characters.
                    </small>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required>
                </div>

                <!-- Error / Success Messages -->
                <p id="message"
                   role="status"
                   aria-live="polite"></p>

                <!-- Register Button -->
                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Log in here</a>
            </p>

        </section>
    </main>

    <!-- Footer -->
    <footer class="auth-footer">
        <p>&copy; 2026 MinWarranty. All rights reserved.</p>
    </footer>

    <!-- Check that both passwords match -->
    <script>
        const passwordInput =
            document.getElementById("password");

        const confirmInput =
            document.getElementById("confirm-password");

        function checkPasswords() {
            if (confirmInput.value !== passwordInput.value) {
                confirmInput.setCustomValidity(
                    "Passwords do not match."
                );
            } else {
                confirmInput.setCustomValidity("");
            }
        }

        passwordInput.addEventListener("input", checkPasswords);
        confirmInput.addEventListener("input", checkPasswords);

        document.getElementById("auth-form")
            .addEventListener("submit", function () {
                checkPasswords();
            }, true);
    </script>

</body>
</html>
